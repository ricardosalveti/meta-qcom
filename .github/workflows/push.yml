name: Build on push

on:
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: read

jobs:
  build:
    uses: ./.github/workflows/build-yocto.yml
  # Hardware tests (test.yml) are disabled for staging validation: the run
  # only exercises the full build matrix and the S3 sstate cache, not LAVA.
  # Skipping "test" also skips "publish-test-results" via its needs.
  test:
    if: false
    uses: ./.github/workflows/test.yml
    needs: [build]
    secrets: inherit
    with:
      build_id: ${{ github.run_id }}
  publish-test-results:
    uses: ./.github/workflows/publish-results.yml
    needs: test
    secrets: inherit
    with:
      workflow_id: ${{ github.run_id }}
      event_name: ${{ github.event_name }}
      event_file: ${{ github.event_path }}
      commit: ${{ github.sha }}
